<!DOCTYPE html>
<html lang="de-AT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2747">
  <meta name="robots" content="noindex,follow">
  <title>Vielen Dank | OBC – Ortner BauConsult</title>
  <style>
    :root{--navy:#0f2747;--bordeaux:#66343a;--ink:#1a2530;--muted:#66717c;--line:#dfe5ea;--soft:#f5f7fa;--white:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f5f7fa,#eef2f5);line-height:1.65}
    .box{width:min(680px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(30px,6vw,58px);box-shadow:0 18px 50px rgba(15,39,71,.10)}
    .eyebrow{color:var(--bordeaux);font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}h1{margin:0;color:var(--navy);font-size:clamp(2.3rem,7vw,4rem);line-height:1.08;letter-spacing:-.03em}p{color:var(--muted);font-size:1.08rem;margin:20px 0 0}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:.8rem 1.2rem;border-radius:999px;text-decoration:none;font-weight:800}.primary{background:var(--bordeaux);color:#fff}.secondary{border:1px solid #cbd5dd;color:var(--navy)}
  </style>
</head>
<body>
  <main class="box">
    <div class="eyebrow">OBC · Anfrage gesendet</div>
    <h1>Vielen Dank für Ihre Nachricht.</h1>
    <p>Ihre Projektanfrage wurde übermittelt. OBC meldet sich nach Durchsicht der Angaben persönlich bei Ihnen.</p>
    <div class="actions">
      <a class="btn primary" href="index.html">Zurück zur Startseite</a>
      <a class="btn secondary" href="mailto:info@obc.co.at">Direkt per E-Mail</a>
    </div>
  </main>
</body>
</html>
